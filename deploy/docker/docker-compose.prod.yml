name: mangahub-prod

x-backend-common: &backend-common
  image: "${MANGAHUB_IMAGE:-mangahub-backend:local}"
  restart: unless-stopped
  init: true
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  networks:
    - backend

services:
  data-init:
    image: "${MANGAHUB_IMAGE:-mangahub-backend:local}"
    user: "0:0"
    command: ["sh", "-c", "chown -R 10001:10001 /app/data"]
    restart: "no"
    read_only: true
    network_mode: none
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
    volumes:
      - mangahub-data:/app/data

  edge:
    image: nginxinc/nginx-unprivileged:1.30-alpine3.24@sha256:44e36330f74d4f3a1d4e222acca9e23b401fb87811a7597024502bb759c4dd49
    user: "101:101"
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    ports:
      - "${HOST_HTTP_PORT:-8088}:8080"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=32m
      - /var/run:rw,noexec,nosuid,size=1m
      - /tmp:rw,noexec,nosuid,size=16m
    networks:
      - frontend
    depends_on:
      frontend:
        condition: service_healthy
      mangahub-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 15s

  frontend:
    image: "${MANGAHUB_FRONTEND_IMAGE:-mangahub-frontend:local}"
    user: "101:101"
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=32m
      - /var/run:rw,noexec,nosuid,size=1m
      - /tmp:rw,noexec,nosuid,size=16m
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 15s

  mangahub-api:
    <<: *backend-common
    command: ["api-server"]
    volumes:
      - mangahub-data:/app/data
    environment:
      PORT: "8080"
      DB_PATH: /app/data/mangahub.db
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in a protected runtime environment file}"
      GIN_MODE: release
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      LOG_FORMAT: json
      FRONTEND_ORIGINS: "${PUBLIC_ORIGIN:-http://localhost:8088}"
      TRUSTED_PROXIES: 172.30.0.0/24
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      ENABLE_TCP_SERVER: "false"
      ENABLE_UDP_SERVER: "false"
      ENABLE_GRPC_SERVER: "false"
      TCP_PORT: mangahub-tcp:9090
      UDP_PORT: mangahub-udp:9091
      GRPC_PORT: mangahub-grpc:9092
    networks:
      - frontend
      - backend
    depends_on:
      data-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mangahub-tcp:
        condition: service_started
      mangahub-udp:
        condition: service_started
      mangahub-grpc:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    command:
      - redis-server
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - "300"
      - "100"
      - --save
      - "60"
      - "1000"
    volumes:
      - redis-data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  mangahub-tcp:
    <<: *backend-common
    command: ["tcp-server"]
    volumes:
      - mangahub-data:/app/data
    environment:
      TCP_PORT: "9090"
      DB_PATH: /app/data/mangahub.db
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in a protected runtime environment file}"
    depends_on:
      data-init:
        condition: service_completed_successfully

  mangahub-udp:
    <<: *backend-common
    command: ["udp-server"]
    volumes:
      - mangahub-data:/app/data
    environment:
      UDP_PORT: "9091"
      DB_PATH: /app/data/mangahub.db
    depends_on:
      data-init:
        condition: service_completed_successfully

  mangahub-grpc:
    <<: *backend-common
    command: ["grpc-server"]
    volumes:
      - mangahub-data:/app/data
    environment:
      GRPC_PORT: "9092"
      DB_PATH: /app/data/mangahub.db
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in a protected runtime environment file}"
    depends_on:
      data-init:
        condition: service_completed_successfully

networks:
  frontend:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  backend:
    internal: true
    ipam:
      config:
        - subnet: 172.31.0.0/24

volumes:
  mangahub-data:
  redis-data:
