server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    client_max_body_size 2m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # A small public readiness endpoint used by deployment checks.
    location = /health {
        proxy_pass http://mangahub-api:8080/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # Detailed health and Swagger remain reachable only through the private API
    # container network, not through the public edge.
    location ^~ /api/health/ {
        return 404;
    }

    location = /api/swagger {
        return 404;
    }

    location ^~ /api/swagger/ {
        return 404;
    }

    # WebSocket chat. Strip /api and preserve the protocol upgrade.
    location ^~ /api/ws/ {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://mangahub-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Server-Sent Events must not be buffered or cached.
    location ^~ /api/events/ {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://mangahub-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        add_header X-Accel-Buffering "no";
    }

    # REST API. The /api prefix avoids collisions between React routes such as
    # /manga/:id and the backend's /manga/:id endpoint.
    location ^~ /api/ {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://mangahub-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # The internal frontend Nginx owns the SPA fallback and static caching.
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
