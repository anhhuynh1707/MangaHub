name: CI

on:
  push:
    branches: [main, develop, features/devsecops]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  security:
    name: Security gates
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read

  operations:
    name: Deployment script checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check Bash syntax
        run: bash -n deploy/scripts/*.sh deploy/tests/*.sh

      - name: Validate monitoring JSON
        run: >-
          jq empty
          deploy/aws/MangaHubDemoCloudWatchPolicy.json
          deploy/cloudwatch/amazon-cloudwatch-agent.json

      - name: Lint deployment scripts
        run: >-
          docker run --rm
          -v "$PWD:/workspace:ro"
          -w /workspace
          koalaman/shellcheck-alpine@sha256:9955be09ea7f0dbf7ae942ac1f2094355bb30d96fffba0ec09f5432207544002
          shellcheck --severity=warning deploy/scripts/*.sh deploy/tests/*.sh

      - name: Test health metric publisher
        run: sudo ./deploy/tests/publish-health-metrics.test.sh

  # ── Backend ───────────────────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Build — api-server
        run: go build ./cmd/api-server/

      - name: Build — tcp-server
        run: go build ./cmd/tcp-server/

      - name: Build — udp-server
        run: go build ./cmd/udp-server/

      - name: Build — grpc-server
        run: go build ./cmd/grpc-server/

      - name: Build — db-tool
        run: go build ./cmd/db-tool/

      - name: Build — cli
        run: go build ./cmd/cli/

      - name: Run tests (auth)
        run: go test -race -v -timeout 30s ./internal/auth/...

      - name: Run tests (tcp)
        run: go test -race -v -timeout 30s ./internal/tcp/...

      - name: Run tests (sanitize)
        run: go test -race -v -timeout 30s ./pkg/sanitize/...

      - name: Run tests (udp)
        run: go test -race -v -timeout 30s ./internal/udp/...

      - name: Run tests (database operations)
        run: go test -race -v -timeout 60s ./internal/dbops/...

      - name: Run complete test suite
        run: go test -timeout 120s ./...

      - name: Vet
        run: go vet ./...

  # ── Frontend ──────────────────────────────────────────────────────
  frontend:
    name: Frontend Build & Type Check
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Audit dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Build
        working-directory: frontend
        run: npm run build

  # ── End-to-end (Playwright) ───────────────────────────────────────
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-24.04
    needs: [build-and-test, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Build & start backend
        run: |
          go build -tags=sqlite_fts5 -o /tmp/api ./cmd/api-server
          # CI-only throwaway signing secret (the e2e DB at /tmp/e2e.db is ephemeral)
          export JWT_SECRET=$(openssl rand -base64 48)
          ENABLE_TCP_SERVER=false ENABLE_UDP_SERVER=false ENABLE_GRPC_SERVER=false \
            REDIS_ADDR=localhost:6399 DB_PATH=/tmp/e2e.db PORT=8080 \
            GIN_MODE=release LOG_LEVEL=error /tmp/api &
          echo "Waiting for API…"
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health > /dev/null 2>&1 && { echo "API up"; break; }
            sleep 1
          done

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: frontend
        env:
          E2E_API_URL: http://localhost:8080
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ── Docker ────────────────────────────────────────────────────────
  docker:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-24.04
    needs: [build-and-test, frontend]   # gate on both backend AND frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Generate CI JWT secret
        # docker-compose now requires JWT_SECRET; a throwaway value lets the
        # smoke test run. Containers + volumes are torn down at the end.
        run: echo "JWT_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"

      - name: Build all Docker images
        run: docker compose build

      - name: Validate production Compose merge
        env:
          PUBLIC_ORIGIN: http://localhost:8088
          HOST_HTTP_PORT: "8088"
          RAW_BIND_ADDRESS: 127.0.0.1
        run: >-
          docker compose
          -f deploy/docker/docker-compose.prod.yml
          -f deploy/docker/docker-compose.prod.local.yml
          -f deploy/docker/docker-compose.raw.yml
          config --quiet

      - name: Validate CloudWatch Compose modes
        env:
          PUBLIC_ORIGIN: http://localhost:8088
          HOST_HTTP_PORT: "8088"
          RAW_BIND_ADDRESS: 127.0.0.1
        run: |
          if grep --fixed-strings --quiet 'awslogs-create-stream' \
              deploy/docker/docker-compose.cloudwatch.yml; then
            echo "awslogs-create-stream is incompatible with the supported EC2 Docker baseline" >&2
            exit 1
          fi
          grep --fixed-strings --quiet 'awslogs-create-group: "false"' \
            deploy/docker/docker-compose.cloudwatch.yml
          docker compose \
            -f deploy/docker/docker-compose.prod.yml \
            -f deploy/docker/docker-compose.cloudwatch.yml \
            config --quiet
          docker compose \
            -f deploy/docker/docker-compose.prod.yml \
            -f deploy/docker/docker-compose.raw.yml \
            -f deploy/docker/docker-compose.cloudwatch.yml \
            config --quiet

      - name: Start all services
        run: docker compose up -d

      - name: Wait for API health endpoint
        run: |
          echo "Waiting for API to become healthy..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
              echo "✅ API is up (attempt $i)"
              exit 0
            fi
            echo "  attempt $i/30 — retrying in 3s..."
            sleep 3
          done
          echo "❌ API did not become healthy after 90 seconds"
          docker compose logs
          exit 1

      - name: Verify API returns valid JSON
        run: |
          response=$(curl -sf http://localhost:8080/health)
          echo "Health response: $response"
          echo "$response" | python3 -c "import sys, json; json.load(sys.stdin); print('✅ Valid JSON')"

      - name: Print service logs (always, for debugging)
        if: always()
        run: docker compose logs --tail=50

      - name: Stop and remove all services and volumes
        if: always()
        run: docker compose down -v

  # ── Publish ───────────────────────────────────────────────────────
  publish:
    name: Publish immutable images to GHCR
    runs-on: ubuntu-24.04
    needs: [docker, e2e, security, operations]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/features/devsecops')
    # The backend and frontend images are published sequentially. A cold
    # frontend BuildKit cache can take more than 15 minutes even when healthy.
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract backend image metadata
        id: backend-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push backend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract frontend image metadata
        id: frontend-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-frontend
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long,prefix=sha-

      - name: Build and push frontend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: frontend
          push: true
          platforms: linux/amd64
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          build-args: VITE_API_URL=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max
